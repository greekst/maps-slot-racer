<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maps Racing Sim — Mapbox GL JS v3</title>

    <!-- Mapbox GL JS v3 -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.0.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.0.0/mapbox-gl.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
        #map { width: 100%; height: 100%; }

        /* HUD overlay */
        #hud {
            position: absolute;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 14px;
            padding: 10px 24px;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
            font-size: 13px;
            display: flex;
            gap: 28px;
            align-items: center;
            pointer-events: none;
            user-select: none;
        }
        #hud .label { opacity: 0.55; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; }
        #hud .value { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
        #hud .unit  { opacity: 0.55; font-size: 11px; }

        #controls-hint {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px;
            padding: 10px 16px;
            color: rgba(255,255,255,0.75);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
            font-size: 12px;
            line-height: 1.8;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <!-- HUD -->
    <div id="hud">
        <div>
            <div class="label">Speed</div>
            <div><span class="value" id="hud-speed">0</span> <span class="unit">km/h</span></div>
        </div>
        <div>
            <div class="label">Heading</div>
            <div><span class="value" id="hud-heading">0</span> <span class="unit">°</span></div>
        </div>
    </div>

    <!-- Controls hint -->
    <div id="controls-hint">
        <b>W</b> — Accelerate<br>
        <b>S</b> — Brake / Reverse<br>
        <b>A / D</b> — Steer
    </div>

    <script type="module" src="./main.js"></script>
</body>
</html>
